# scMultiomeBench path configuration (Python scripts read this).
# Values may be overridden by the environment variables of the same name.
data_root: /path/to/data
project_root: .
benchmark_fun_dir: ./common
published_ref: ./results   # legacy; figure input tables live under results/
# Cloned method repos (scJoint, scBridge, scMoMaT were run from git clones)
tools_root: /path/to/tools
# Genome annotation. NOTE: RMS is hg19 (GRCh37); other datasets are hg38.
ref_root: /path/to/references
